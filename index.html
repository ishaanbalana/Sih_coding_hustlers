<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAFTORA — AI-Powered Digital Business Platform for Artisans | SIH 2026</title>
  <meta name="description"
    content="CRAFT\ORA connects master artisans with buyers through AI cataloguing, cost-based smart pricing, digital product passports, and prototype blockchain provenance records.">
  <meta name="theme-color" content="#215036">

  <!-- Favicon & Stylesheet -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <link rel="stylesheet" href="./css/index.css">

  <!-- QRCode & ZXing Browser Libraries (local bundles) -->
  <script src="./js/lib/qrcode.min.js"></script>
  <script src="./js/lib/zxing-browser.min.js"></script>

  <!-- Import map for Firebase Modular SDK (Firestore & Analytics) -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js",
        "firebase/analytics": "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js"
      }
    }
  </script>
</head>

<body>

  <!-- CRAFTORA Application Root Shell -->
  <div id="app"></div>

  <!-- Dedicated Container for QR Modal (outside #app so re-renders don't wipe it) -->
  <div id="qr-modal-container"></div>

  <!-- Global UI Notification & Transaction Alert Container -->
  <div id="craftora-toast-container" class="toast-container"></div>

  <!-- Main ES6 Modular JavaScript Entry Point -->
  <script type="module" src="./js/app.js"></script>

</body>

</html>
